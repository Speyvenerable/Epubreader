<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b4562c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Epubreader">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Epubreader</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf8f4;--panel:#fff;--ink:#23201b;--muted:#8a8478;--line:#e8e3da;--accent:#b4562c;--ai:#fff;--shadow:0 6px 24px #3a2a1a1f}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#121110;--panel:#1b1a17;--ink:#ebe6db;--muted:#8f897c;--line:#2c2a25;--accent:#e0925f;--ai:#121110;--shadow:0 6px 24px #0008}}
:root[data-theme="light"]{--bg:#faf8f4;--panel:#fff;--ink:#23201b;--muted:#8a8478;--line:#e8e3da;--accent:#b4562c;--ai:#fff;--shadow:0 6px 24px #3a2a1a1f}
:root[data-theme="sepia"]{--bg:#f0e5cb;--panel:#f7eed9;--ink:#40331f;--muted:#8a7a5c;--line:#e0d1ae;--accent:#9a4f22;--ai:#fff;--shadow:0 6px 24px #4a381a26}
:root[data-theme="dark"]{--bg:#121110;--panel:#1b1a17;--ink:#ebe6db;--muted:#8f897c;--line:#2c2a25;--accent:#e0925f;--ai:#121110;--shadow:0 6px 24px #0008}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--accent);color:var(--ai);font-weight:600;font-size:14px;cursor:pointer;transition:transform .15s,box-shadow .2s;box-shadow:var(--shadow)}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.ib{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:background .2s;flex:none}
.ib:hover{background:var(--line)}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* home */
#home{max-width:1040px;margin:0 auto;padding:22px 20px 60px;animation:fade .4s}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.logo{font:700 24px Georgia,serif;letter-spacing:-.3px}.logo span{color:var(--accent)}
.hd .r{display:flex;align-items:center;gap:8px}
#drop{border:1.5px dashed var(--line);border-radius:22px;padding:56px 20px;text-align:center;color:var(--muted);transition:.25s;background:var(--panel)}
#drop.on,#drop:hover{border-color:var(--accent);transform:scale(1.005)}
#drop h2{font:600 22px Georgia,serif;color:var(--ink);margin:12px 0 6px}
#drop p{margin:0 0 18px}
#drop svg{width:44px;height:44px;color:var(--accent)}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.card{cursor:pointer;position:relative;animation:rise .45s both}
.cv{aspect-ratio:2/3;border-radius:6px 10px 10px 6px;overflow:hidden;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font:600 15px/1.25 Georgia,serif;color:#fff;background:linear-gradient(150deg,var(--accent),#3a2619);word-break:break-word;position:relative}
.cv::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(90deg,#0004,#0000)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card:hover .cv{transform:translateY(-5px) scale(1.02)}
.card h3{font-size:14px;margin:10px 0 0;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{font-size:12.5px;color:var(--muted);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{height:3px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--accent);transition:width .4s}
.del{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:#000a;color:#fff;opacity:0;transition:.2s;font-size:16px;line-height:1}
.card:hover .del{opacity:1}
@media (hover:none){.del{opacity:.85}}
/* reader */
#rd{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;z-index:10}
#rd.open{opacity:1;visibility:visible;transform:none;transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
#rtop,#rbot{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg);transition:transform .3s,opacity .3s;z-index:3}
#rtop{padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
#rbot{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap}
#rd.hide #rtop{transform:translateY(-100%);opacity:0}#rd.hide #rbot{transform:translateY(100%);opacity:0}
#rt{flex:1;min-width:0;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#view{position:absolute;inset:0;overflow-y:auto;scroll-behavior:smooth;overscroll-behavior:contain}
#page{max-width:var(--w,700px);margin:0 auto;padding:84px 24px 120px;font-family:var(--ff,Georgia,"Times New Roman",serif);font-size:var(--fs,19px);line-height:1.75;animation:fade .35s}
#page h1,#page h2,#page h3,#page h4{line-height:1.25;margin:1.4em 0 .7em;text-align:center}
#page p{margin:0 0 1em;text-align:justify;hyphens:auto}
#page img,#page svg{max-width:100%;height:auto;border-radius:4px}
#page blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--line);color:var(--muted)}
#page a{color:var(--accent)}
.nx{display:flex;justify-content:space-between;gap:10px;margin-top:44px}
.nx button{padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);transition:.2s;font-size:14px}
.nx button:hover:not(:disabled){border-color:var(--accent)}.nx button.p{background:var(--accent);color:var(--ai);border-color:var(--accent);font-weight:600}.nx button:disabled{opacity:.4}
#seek{flex:1;min-width:120px;accent-color:var(--accent);height:24px}
#pl{font-size:12.5px;color:var(--muted);width:100%;text-align:center;order:3}
/* panels */
#sc{position:absolute;inset:0;background:#0006;opacity:0;visibility:hidden;transition:.3s;z-index:4}
#sc.on{opacity:1;visibility:visible}
#toc{position:absolute;top:0;bottom:0;left:0;width:min(340px,88%);background:var(--panel);z-index:5;transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
#toc.on{transform:none}
#toc h4{margin:0;padding:16px 18px 8px;font:600 18px Georgia,serif}
#tq{margin:4px 14px 8px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;outline:none}
#tq:focus{border-color:var(--accent)}
#tl{flex:1;overflow-y:auto;padding:0 8px 20px}
#tl a{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-size:14px;line-height:1.35;transition:background .15s}
#tl a:hover{background:var(--bg)}#tl a i{font-style:normal;color:var(--muted);min-width:1.8em;text-align:right;font-size:12.5px}
#tl a.cur{color:var(--accent);font-weight:600;background:var(--bg)}
#aa{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));right:10px;width:min(300px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;z-index:5;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transition:.2s;transform-origin:top right}
#aa.on{opacity:1;visibility:visible;transform:none}
#aa label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}#aa label:first-child{margin-top:0}
#aa input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:999px;font-size:13px;transition:.2s}
.seg button.on{background:var(--accent);color:var(--ai);font-weight:600}
#msg{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;visibility:hidden;transition:.3s;z-index:30}
#msg.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="home">
  <div class="hd">
    <div class="logo">Epub<span>reader</span></div>
    <div class="r">
      <button class="ib" id="homeTheme" title="Change theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <label class="btn" for="file"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 5v14M5 12h14"/></svg>Add book</label>
    </div>
  </div>
  <div id="drop">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5z"/><path d="M4 21.5V5.5M9 8h7"/></svg>
    <h2>Drop your EPUB here</h2>
    <p>Or pick a file. It stays on your device and remembers where you stopped.</p>
    <label class="btn" for="file">Choose EPUB</label>
  </div>
  <div id="shelf" hidden style="margin-top:34px"><p class="sec">Your library</p><div id="grid"></div></div>
  <input id="file" type="file" accept=".epub,application/epub+zip" multiple hidden>
</main>

<section id="rd" aria-label="Reader">
  <div id="rtop">
    <button class="ib" id="back" title="Library"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ib" id="tocb" title="Contents"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <div id="rt"></div>
    <button class="ib" id="aab" title="Text settings"><span style="font:700 15px Georgia,serif">Aa</span></button>
  </div>
  <div id="view"><article id="page"></article></div>
  <div id="rbot"><input id="seek" type="range" min="0" max="1000" value="0"><div id="pl"></div></div>
  <div id="sc"></div>
  <aside id="toc"><h4>Contents</h4><input id="tq" type="search" placeholder="Find a chapter…"><div id="tl"></div></aside>
  <div id="aa">
    <label>Text size</label><input id="fs" type="range" min="14" max="32" step="1">
    <label>Font</label><div class="seg" id="ffs"><button data-v="serif">Serif</button><button data-v="sans">Sans</button></div>
    <label>Page width</label><div class="seg" id="ws"><button data-v="560">Narrow</button><button data-v="700">Medium</button><button data-v="880">Wide</button></div>
    <label>Theme</label><div class="seg" id="ths"><button data-v="light">Light</button><button data-v="sepia">Sepia</button><button data-v="dark">Dark</button></div>
  </div>
</section>
<div id="msg"></div>

<script src="lib/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(t){const m=$('msg');m.textContent=t;m.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>m.classList.remove('on'),3000);}

/* ---------- storage ---------- */
const mem=new Map();let dbp;
function db(){return dbp||(dbp=new Promise(r=>{try{const q=indexedDB.open('epubreader',1);q.onupgradeneeded=()=>q.result.createObjectStore('books',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);}catch(e){r(null);}}));}
async function tx(mode,fn){const d=await db();if(!d)return null;return new Promise(r=>{try{const t=d.transaction('books',mode),q=fn(t.objectStore('books'));t.oncomplete=()=>r(q&&q.result!==undefined?q.result:true);t.onerror=()=>r(null);}catch(e){r(null);}});}
const all=async()=>{const r=await tx('readonly',s=>s.getAll());return Array.isArray(r)?r:[...mem.values()];};
const put=async b=>{mem.set(b.id,b);await tx('readwrite',s=>s.put(b));};
const del=async id=>{mem.delete(id);await tx('readwrite',s=>s.delete(id));};

/* ---------- settings ---------- */
const S={fs:19,ff:'serif',w:700,theme:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('er:s')||'{}'));}catch(e){}
function applyS(){
  const r=document.documentElement;
  S.theme?r.dataset.theme=S.theme:r.removeAttribute('data-theme');
  r.style.setProperty('--fs',S.fs+'px');r.style.setProperty('--w',S.w+'px');
  r.style.setProperty('--ff',S.ff==='sans'?'Inter,system-ui,-apple-system,"Segoe UI",sans-serif':'Georgia,"Times New Roman",serif');
  $('fs').value=S.fs;
  [['ffs','ff'],['ws','w'],['ths','theme']].forEach(([id,k])=>[...$(id).children].forEach(b=>b.classList.toggle('on',String(S[k])===b.dataset.v)));
  try{localStorage.setItem('er:s',JSON.stringify(S));}catch(e){}
}
$('fs').oninput=e=>{S.fs=+e.target.value;applyS();};
[['ffs','ff'],['ws','w'],['ths','theme']].forEach(([id,k])=>$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;S[k]=k==='w'?+b.dataset.v:b.dataset.v;applyS();});
$('homeTheme').onclick=()=>{const o=['','light','sepia','dark'];S.theme=o[(o.indexOf(S.theme)+1)%4];applyS();toast('Theme: '+(S.theme||'auto'));};
applyS();

/* ---------- epub parsing ---------- */
const resolve=(base,rel)=>decodeURIComponent(new URL(rel,'http://x/'+base).pathname.slice(1));
const dirOf=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):'';
async function openZip(blob){
  const zip=await JSZip.loadAsync(blob);
  const xml=async p=>new DOMParser().parseFromString(await zip.file(p).async('string'),'application/xml');
  const opfPath=(await xml('META-INF/container.xml')).querySelector('rootfile').getAttribute('full-path');
  const opf=await xml(opfPath),base=dirOf(opfPath);
  const man={};
  opf.querySelectorAll('manifest > item').forEach(i=>man[i.getAttribute('id')]={href:resolve(base,i.getAttribute('href')),type:i.getAttribute('media-type')||'',prop:i.getAttribute('properties')||''});
  const spine=[...opf.querySelectorAll('spine > itemref')].map(r=>man[r.getAttribute('idref')]).filter(Boolean);
  if(!spine.length)throw new Error('empty');
  const g=n=>{const e=opf.getElementsByTagName(n)[0];return e?e.textContent.trim():'';};
  let cov=Object.values(man).find(m=>m.prop.includes('cover-image'));
  if(!cov){const mt=opf.querySelector('meta[name="cover"]');if(mt)cov=man[mt.getAttribute('content')];}
  const names={};
  try{
    const nav=Object.values(man).find(m=>m.prop.includes('nav'));
    if(nav){const d=new DOMParser().parseFromString(await zip.file(nav.href).async('string'),'text/html'),nb=dirOf(nav.href);
      d.querySelectorAll('a[href]').forEach(a=>{const k=resolve(nb,a.getAttribute('href').split('#')[0]);if(!(k in names))names[k]=a.textContent.replace(/\s+/g,' ').trim();});}
    else{const ncx=Object.values(man).find(m=>m.type==='application/x-dtbncx+xml');
      if(ncx){const d=await xml(ncx.href),nb=dirOf(ncx.href);d.querySelectorAll('navPoint').forEach(n=>{const c=n.querySelector('content'),l=n.querySelector('text');if(c&&l){const k=resolve(nb,c.getAttribute('src').split('#')[0]);if(!(k in names))names[k]=l.textContent.trim();}});}}
  }catch(e){}
  return {zip,spine,names,title:g('dc:title'),author:g('dc:creator'),cover:cov};
}

/* ---------- library ---------- */
let urls=[];
async function showLib(){
  urls.forEach(URL.revokeObjectURL);urls=[];
  const list=(await all()).sort((a,b)=>b.added-a.added);
  $('shelf').hidden=!list.length;
  $('drop').style.display=list.length?'none':'block';
  $('grid').innerHTML=list.map((b,i)=>{let img='';if(b.cover){const u=URL.createObjectURL(b.cover);urls.push(u);img=`<img src="${u}" alt="">`;}
    return `<div class="card" data-id="${b.id}" style="animation-delay:${Math.min(i,10)*40}ms"><div class="cv">${esc(b.title)}${img}</div><button class="del" data-del="${b.id}" title="Remove">×</button><h3>${esc(b.title)}</h3><p>${esc(b.author||'')}</p><div class="pb"><i style="width:${Math.round((b.pct||0)*100)}%"></i></div></div>`;}).join('');
}
$('grid').onclick=async e=>{
  const d=e.target.closest('[data-del]');
  if(d){e.stopPropagation();if(confirm('Remove this book from your library?')){await del(d.dataset.del);showLib();}return;}
  const c=e.target.closest('.card');if(c){const r=(await all()).find(x=>x.id===c.dataset.id);if(r)openBook(r);}
};
async function addFiles(files){
  let n=0;
  for(const f of files){
    if(!/\.epub$/i.test(f.name)){toast('Only .epub files are supported');continue;}
    try{
      const z=await openZip(f);let cv=null;
      if(z.cover){const zf=z.zip.file(z.cover.href);if(zf)cv=new Blob([await zf.async('uint8array')],{type:z.cover.type||'image/jpeg'});}
      await put({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:z.title||f.name.replace(/\.epub$/i,''),author:z.author,blob:f,cover:cv,added:Date.now(),ch:0,pos:0,pct:0});n++;
    }catch(err){toast('Could not read '+f.name);}
  }
  if(n)toast(n===1?'Book added':n+' books added');
  showLib();
}
$('file').onchange=e=>{addFiles([...e.target.files]);e.target.value='';};
const drop=$('drop');
addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('on');});
addEventListener('dragleave',e=>{if(!e.relatedTarget){drop.classList.remove('on');}});
addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('on');if(e.dataTransfer&&e.dataTransfer.files.length)addFiles([...e.dataTransfer.files]);});

/* ---------- reader ---------- */
let cur=null,B=null,imgUrls=[],saveT=null;
const view=$('view'),page=$('page'),rd=$('rd');
function panels(on){$('toc').classList.toggle('on',on==='toc');$('aa').classList.toggle('on',on==='aa');$('sc').classList.toggle('on',on==='toc'||on==='aa');}
$('tocb').onclick=()=>panels($('toc').classList.contains('on')?'':'toc');
$('aab').onclick=()=>panels($('aa').classList.contains('on')?'':'aa');
$('sc').onclick=()=>panels('');
$('back').onclick=async()=>{clearTimeout(saveT);flush();panels('');rd.classList.remove('open');setTimeout(()=>{if(!rd.classList.contains('open')){page.innerHTML='';B=null;cur=null;imgUrls.forEach(URL.revokeObjectURL);imgUrls=[];}},400);showLib();};

async function openBook(rec){
  cur=rec;rd.classList.add('open');rd.classList.remove('hide');$('rt').textContent=rec.title;
  page.innerHTML='<p style="text-align:center;color:var(--muted)">Opening…</p>';
  try{
    const z=await openZip(rec.blob);B={...z,n:z.spine.length,ch:0};
    $('tl').innerHTML=z.spine.map((s,i)=>`<a data-i="${i}"><i>${i+1}</i><span>${esc(z.names[s.href]||('Section '+(i+1)))}</span></a>`).join('');
    $('tq').value='';
    await goCh(Math.min(rec.ch||0,B.n-1),rec.pos||0);
  }catch(e){page.innerHTML='<p style="text-align:center">Could not open this book.</p>';}
}
$('tl').onclick=e=>{const a=e.target.closest('a');if(a){goCh(+a.dataset.i,0);panels('');}};
$('tq').oninput=()=>{const q=$('tq').value.trim().toLowerCase();[...$('tl').children].forEach(a=>a.style.display=!q||a.textContent.toLowerCase().includes(q)?'':'none');};

async function chapterFrag(i){
  const it=B.spine[i],raw=await B.zip.file(it.href).async('string');
  let d=new DOMParser().parseFromString(raw,'application/xhtml+xml');
  if(d.querySelector('parsererror'))d=new DOMParser().parseFromString(raw,'text/html');
  const body=d.body||d.documentElement;
  body.querySelectorAll('script,style,link,iframe,object,embed,form').forEach(n=>n.remove());
  body.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||a.name==='style'||a.name==='class')n.removeAttribute(a.name);}));
  const dir=dirOf(it.href);
  for(const im of body.querySelectorAll('img,image')){
    const at=im.hasAttribute('src')?'src':im.hasAttribute('xlink:href')?'xlink:href':'href',s=im.getAttribute(at);
    if(!s)continue;if(/^https?:/.test(s)){im.removeAttribute(at);continue;}if(/^data:/.test(s))continue;
    const f=B.zip.file(resolve(dir,s));if(f){const u=URL.createObjectURL(new Blob([await f.async('uint8array')]));imgUrls.push(u);im.setAttribute(at,u);}
  }
  const h=document.createElement('div');h.innerHTML=body.innerHTML;
  h.querySelectorAll('a[href]').forEach(a=>{
    const hr=a.getAttribute('href');
    if(/^https?:/.test(hr)){a.target='_blank';a.rel='noopener noreferrer';return;}
    const k=B.spine.findIndex(s=>s.href===resolve(dir,hr.split('#')[0]));
    a.removeAttribute('href');if(k>=0){a.style.cursor='pointer';a.onclick=()=>goCh(k,0);}
  });
  const f=document.createDocumentFragment();while(h.firstChild)f.appendChild(h.firstChild);return f;
}
async function goCh(i,pos){
  if(!B||i<0||i>=B.n)return;
  B.ch=i;const frag=await chapterFrag(i);
  imgUrls.slice(0,-1).length>60&&(imgUrls.forEach(URL.revokeObjectURL),imgUrls=[]);
  page.style.animation='none';void page.offsetWidth;page.style.animation='';
  page.innerHTML='';page.appendChild(frag);
  const nx=document.createElement('div');nx.className='nx';
  nx.innerHTML=`<button ${i?'':'disabled'} data-d="-1">← Previous</button><button class="p" ${i<B.n-1?'':'disabled'} data-d="1">Next chapter →</button>`;
  nx.onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)goCh(i+(+b.dataset.d),0);};
  page.appendChild(nx);
  view.style.scrollBehavior='auto';
  requestAnimationFrame(()=>{view.scrollTop=pos?pos*Math.max(1,view.scrollHeight-view.clientHeight):0;view.style.scrollBehavior='';update();});
  [...$('tl').children].forEach((a,k)=>{a.classList.toggle('cur',k===i);if(k===i)a.scrollIntoView({block:'nearest'});});
  flush();
}
function frac(){return B?Math.min(1,view.scrollTop/Math.max(1,view.scrollHeight-view.clientHeight)):0;}
function overall(){return B?Math.min(1,(B.ch+frac())/B.n):0;}
function update(){if(!B)return;const p=overall();$('seek').value=Math.round(p*1000);
  $('pl').textContent=(B.names[B.spine[B.ch].href]||('Section '+(B.ch+1)))+' · '+Math.round(p*100)+'%';}
function flush(){if(!cur||!B)return;cur.ch=B.ch;cur.pos=frac();cur.pct=overall();put(cur);}
view.addEventListener('scroll',()=>{update();clearTimeout(saveT);saveT=setTimeout(flush,600);},{passive:true});
$('seek').oninput=e=>{if(!B)return;const v=+e.target.value/1000*B.n,i=Math.min(B.n-1,Math.floor(v));goCh(i,v-i);};
/* tap to show/hide bars */
let sx=0,sy=0;
view.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
view.addEventListener('click',e=>{if(Math.abs(e.clientX-sx)>6||Math.abs(e.clientY-sy)>6)return;if(e.target.closest('a,button'))return;if(String(getSelection()))return;panels('');rd.classList.toggle('hide');});
addEventListener('keydown',e=>{
  if(!rd.classList.contains('open')||e.target.tagName==='INPUT'&&e.target.type==='search')return;
  if(e.key==='Escape'){if($('toc').classList.contains('on')||$('aa').classList.contains('on'))panels('');else $('back').click();}
  if(e.key==='ArrowRight')goCh(B.ch+1,0);if(e.key==='ArrowLeft')goCh(B.ch-1,0);
});
addEventListener('pagehide',flush);
showLib();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
