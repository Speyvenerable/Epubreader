<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Epubfinder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Epubfinder</title>
<meta name="description" content="Find and download EPUB books.">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--panel:#fff;--ink:#0a0a0a;--muted:#757575;--line:#e6e6e6;--bar:#efefef;--accent:#0a0a0a;--ai:#fff;--shadow:0 10px 32px #0000001a}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#000;--panel:#0d0d0d;--ink:#f5f5f5;--muted:#8a8a8a;--line:#262626;--bar:#161616;--accent:#f5f5f5;--ai:#000;--shadow:0 10px 32px #000c}}
:root[data-theme="light"]{--bg:#fff;--panel:#fff;--ink:#0a0a0a;--muted:#757575;--line:#e6e6e6;--bar:#efefef;--accent:#0a0a0a;--ai:#fff;--shadow:0 10px 32px #0000001a}
:root[data-theme="dark"]{--bg:#000;--panel:#0d0d0d;--ink:#f5f5f5;--muted:#8a8a8a;--line:#262626;--bar:#161616;--accent:#f5f5f5;--ai:#000;--shadow:0 10px 32px #000c}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .3s,color .3s;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:860px;margin:0 auto;padding:16px 18px 80px}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bar);border-radius:14px;padding:8px 10px;position:sticky;top:8px;z-index:5;transition:background .3s;flex-wrap:wrap}
.tabs{display:flex;gap:8px}
.tabs button,.pill{padding:8px 18px;border-radius:999px;background:var(--panel);font-size:14.5px;transition:transform .15s,background .2s,color .2s;display:inline-flex;align-items:center;gap:7px}
.tabs button:hover,.pill:hover{transform:translateY(-1px)}
.tabs button.on,.pill.dark{background:var(--accent);color:var(--ai);font-weight:600}
button:active{transform:scale(.96)}
.r{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1.5px solid var(--line);overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;transition:.2s;padding:0}
.av:hover{border-color:var(--accent)}.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.sb{display:flex;align-items:center;gap:10px;background:var(--bar);border-radius:999px;padding:4px 18px;margin:16px 0 8px;transition:box-shadow .25s,background .3s}
.sb:focus-within{box-shadow:0 0 0 2px var(--accent)}
.sb input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:11px 0}
.sb svg{color:var(--muted)}
#note{font-size:13px;color:var(--muted);margin:6px 4px 0;min-height:4px}
.tagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0 6px}
.tg{padding:14px;border:1px solid var(--line);border-radius:14px;text-align:left;transition:.2s;background:var(--panel)}
.tg:hover{border-color:var(--accent);transform:translateY(-2px)}.tg.on{background:var(--accent);color:var(--ai);border-color:var(--accent)}
.tg b{display:block;font-size:14.5px}.tg small{opacity:.65;font-size:12px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 12px;font-size:13px;color:var(--muted);min-height:20px}
.card{border:1px solid var(--ink);border-radius:6px;padding:16px 18px;margin-bottom:14px;background:var(--panel);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;animation:rise .4s both;display:flex;gap:14px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rk{font:700 22px Georgia,serif;min-width:34px;color:var(--muted)}
.body{flex:1;min-width:0}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.who i{width:26px;height:26px;border-radius:50%;background:var(--bar);overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font:700 11px system-ui;font-style:normal;color:var(--ink)}
.who i img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.who b{color:var(--ink);font-weight:600}
.card h3{font:600 21px/1.25 Georgia,serif;margin:10px 0 6px;overflow-wrap:anywhere}
.card p{margin:0 0 6px;color:var(--muted);font-size:14.5px;overflow-wrap:anywhere;white-space:pre-line}
.lk{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11.5px;padding:2px 10px;border-radius:999px;background:var(--bar);color:var(--muted);margin-left:8px;font-weight:500;text-decoration:none}
.act{display:flex;gap:6px;margin-top:12px;align-items:center;flex-wrap:wrap}
.ab{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;transition:.2s}
.ab:hover{border-color:var(--accent)}.ab.on{background:var(--accent);color:var(--ai);border-color:var(--accent)}
.ab.g{border-color:transparent;color:var(--muted)}.ab.g:hover{color:var(--ink);border-color:var(--line)}
.sp{flex:1}
.time{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:56px 10px;border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font:600 21px Georgia,serif;margin-bottom:6px}
.scrim{position:fixed;inset:0;background:#0007;opacity:0;visibility:hidden;transition:.25s;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.scrim.on{opacity:1;visibility:visible}
.md{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:22px;transform:translateY(14px) scale(.98);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.scrim.on .md{transform:none}
.md h2{font:600 22px Georgia,serif;margin:0 0 14px}
.md label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.md input,.md textarea,.md select{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:none;transition:border-color .2s}
.md input:focus,.md textarea:focus,.md select:focus{border-color:var(--accent)}
.md textarea{min-height:92px;resize:vertical}
.rights{font-size:12.5px;color:var(--muted);margin:14px 0 0;line-height:1.45}
.mr{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.err{color:var(--ink);font-size:13px;margin-top:10px;font-weight:600;min-height:18px}
#menu{position:fixed;top:64px;right:14px;width:min(260px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px;z-index:15;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top right;transition:.2s}
#menu.on{opacity:1;visibility:visible;transform:none}
#menu .h{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}#menu .h b{display:block;overflow-wrap:anywhere}#menu .h small{color:var(--muted)}
#menu button{display:flex;width:100%;text-align:left;padding:10px;border-radius:10px;gap:10px;align-items:center;transition:background .15s}
#menu button:hover{background:var(--bar)}
#menu input{width:100%;margin:6px 0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
#msg{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;visibility:hidden;transition:.3s;z-index:40}
#msg.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:520px){.rk{display:none}.pill span{display:none}}
.pill{text-decoration:none}
.au{color:var(--ink);font-size:14px;margin:0 0 6px}
.sz{font-size:12.5px;color:var(--muted);margin-left:8px}
.act{margin-top:14px}
.av svg{width:18px;height:18px}
.card h3{margin-top:2px}
.pill[hidden]{display:none}
.pill#install{border:1px solid var(--line)}
@media (max-width:520px){.pill#install span{display:none}.pill#install{padding:8px 11px}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="tabs" id="tabs"><button data-t="home" class="on">Home</button><button data-t="rank">Rank</button></div>
    <div class="r"><button class="pill" id="install" hidden><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>Install app</span></button><button class="av" id="th" title="Change theme" aria-label="Change theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button></div>
  </nav>
  <div class="sb"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search novel name…" autocomplete="off"></div>
  <div class="meta"><span id="count"></span><span id="sub"></span></div>
  <div id="feed"></div>
</div>
<div id="msg"></div>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const CFG={url:(typeof SUPABASE_URL!=='undefined'?SUPABASE_URL:'').replace(/\/$/,''),key:typeof SUPABASE_KEY!=='undefined'?SUPABASE_KEY:''};
const LIVE=!!(CFG.url&&CFG.key);
let books=[],counts={},loaded=false,failed=false;const S={tab:'home',q:''};
let theme='';try{theme=localStorage.getItem('ef:th')||'';}catch(e){}
function applyTheme(){theme?document.documentElement.dataset.theme=theme:document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('ef:th',theme);}catch(e){}}
applyTheme();
$('th').onclick=()=>{const o=['','light','dark'];theme=o[(o.indexOf(theme)+1)%3];applyTheme();$('th').title='Theme: '+(theme||'auto');};
const ago=t=>{const s=(Date.now()-t)/1000;if(s<3600)return'just now';if(s<86400)return Math.floor(s/3600)+' h ago';if(s<2592000)return Math.floor(s/86400)+' d ago';return new Date(t).toLocaleDateString();};
const fsize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const url=f=>/^https?:/.test(f)?f:'books/'+encodeURIComponent(f).replace(/%2F/g,'/');
const dl=b=>counts[b.file]!==undefined?counts[b.file]:(b.downloads||0);
const SUB=LIVE?'':'';
async function load(){
  try{const r=await fetch('books.json',{cache:'no-cache'});if(!r.ok)throw 0;const j=await r.json();
    books=(Array.isArray(j)?j:[]).filter(b=>b&&b.title&&b.file).sort((a,b)=>(b.added||0)-(a.added||0));}
  catch(e){failed=true;}
  loaded=true;render();
  if(LIVE){try{const r=await fetch(CFG.url+'/rest/v1/downloads?select=file,count',{headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key}});
    if(r.ok){(await r.json()).forEach(x=>counts[x.file]=Number(x.count)||0);render();}}catch(e){}}
}
load();
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  const q=S.q.trim().toLowerCase();
  let l=books.filter(b=>!q||(b.title+' '+(b.author||'')+' '+(b.desc||'')+' '+(b.tag||'')).toLowerCase().includes(q));
  if(S.tab==='rank')l=l.slice().sort((a,b)=>dl(b)-dl(a)||(b.added||0)-(a.added||0));
  $('count').textContent=!loaded?'Loading…':S.tab==='rank'?'Most downloaded':`${l.length} book${l.length===1?'':'s'}`;
  $('sub').textContent=SUB;
  $('feed').innerHTML=failed?'<div class="empty"><b>Could not load the library</b>Open this site from its web address (not as a local file) and make sure books.json is next to index.html.</div>'
   :(loaded&&!l.length)?`<div class="empty"><b>${S.q?'No novels found':'No books yet'}</b>${S.q?'Try another title.':'New EPUBs will appear here.'}</div>`
   :l.map((b,i)=>`<article class="card" style="animation-delay:${Math.min(i,10)*30}ms">${S.tab==='rank'?`<div class="rk">${i+1}</div>`:''}<div class="body">
    <h3>${esc(b.title)}</h3>
    ${b.author?`<div class="au">${esc(b.author)}</div>`:''}
    ${b.desc?`<p>${esc(b.desc)}</p>`:''}
    <div class="act"><a class="pill dark" href="${esc(url(b.file))}" download data-f="${esc(b.file)}"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Download EPUB</a>${b.tag?`<span class="tag">${esc(b.tag)}</span>`:''}<span class="sz" data-c="${esc(b.file)}">${dl(b).toLocaleString()} download${dl(b)===1?'':'s'}${b.size?' · '+fsize(b.size):''}${b.added&&S.tab==='home'?' · '+ago(b.added):''}</span></div></div></article>`).join('');
}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.t;render();};
$('q').oninput=e=>{S.q=e.target.value;render();};
/* count a download once per browser */
$('feed').addEventListener('click',e=>{
  const a=e.target.closest('a[data-f]');if(!a||!LIVE)return;
  const f=a.dataset.f,k='ef:c:'+f;
  try{if(localStorage.getItem(k))return;localStorage.setItem(k,'1');}catch(x){}
  counts[f]=dl({file:f,downloads:(books.find(b=>b.file===f)||{}).downloads})+1;
  const s=document.querySelector('[data-c="'+CSS.escape(f)+'"]');if(s)s.textContent=s.textContent.replace(/^[\d,]+/,counts[f].toLocaleString());
  fetch(CFG.url+'/rest/v1/rpc/increment_download',{method:'POST',keepalive:true,headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify({f})}).catch(()=>{});
});
render();
function toast(t){const m=$('msg');m.textContent=t;m.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>m.classList.remove('on'),3200);}

/* ---- Install app button ---- */
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function showInstall(){const b=document.getElementById('install');if(b)b.hidden=isStandalone();}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;showInstall();});
addEventListener('appinstalled',()=>{deferredInstall=null;const b=document.getElementById('install');if(b)b.hidden=true;toast('App installed');});
document.getElementById('install').onclick=async()=>{
  if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(e){}deferredInstall=null;return;}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  toast(ios?'Tap Share, then Add to Home Screen':'Open the browser menu (⋮), then tap Install app');
};
showInstall();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
